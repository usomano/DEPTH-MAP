/* ---------- motore ---------- */

function scaledCanvas(img, sx, sy, sw, sh, tw, th) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(tw));
  c.height = Math.max(1, Math.round(th));
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
  return c;
}

function fitSize(w, h, maxSide) {
  const scale = Math.min(1, maxSide / Math.max(w, h));
  return { w: Math.max(1, Math.round(w * scale)), h: Math.max(1, Math.round(h * scale)) };
}

// Misura d'uscita richiesta, anche sopra la sorgente. Per la stampa serve: una
// foto da 1500px deve poter dare una mappa da 2480px a 210mm e 300dpi. La
// profondita' e' un campo continuo, ingrandirla non inventa dettaglio ma non
// introduce nemmeno artefatti. Il tetto e' sui pixel totali, per la memoria.
const MAX_OUT_PIXELS = 40e6;

function targetSize(w, h, longSide) {
  let scale = longSide / Math.max(w, h);
  if (w * h * scale * scale > MAX_OUT_PIXELS) scale = Math.sqrt(MAX_OUT_PIXELS / (w * h));
  return { w: Math.max(1, Math.round(w * scale)), h: Math.max(1, Math.round(h * scale)) };
}

const FORCE_WASM = 'depthmap-force-wasm';

// La libreria concatena le creazioni di sessione su una promise condivisa
// (webInitChain). Se una fallisce, quella promise resta rifiutata e ogni
// tentativo successivo rilancia lo stesso errore senza ricaricare niente: un
// ripiego a runtime e' impossibile. Quindi il device va deciso prima, e il primo
// tentativo deve essere quello buono.
async function pickDevice() {
  if (IS_SAFARI) return 'wasm';
  try { if (localStorage.getItem(FORCE_WASM) === '1') return 'wasm'; } catch (e) { /* storage negato */ }
  if (!('gpu' in navigator)) return 'wasm';
  try {
    const adapter = await navigator.gpu.requestAdapter();
    if (!adapter) return 'wasm';
  } catch (e) {
    return 'wasm';
  }
  return 'webgpu';
}

// Un modello senza file ONNX fa fallire la creazione della sessione, e un
// fallimento lascia rifiutata la catena di init della libreria: da li' in poi
// serve ricaricare. Meglio chiederlo all'API prima di toccare la libreria.
async function verifyRepo(id) {
  if (!/^[\w.-]+\/[\w.-]+$/.test(id)) return { ok: false, reason: 'il nome del repo non e\u2019 valido' };
  try {
    const res = await fetch(`https://huggingface.co/api/models/${id}`);
    if (res.status === 404) return { ok: false, reason: 'il repo non esiste' };
    if (!res.ok) return { ok: true };
    const info = await res.json();
    const files = Array.isArray(info.siblings) ? info.siblings.map(f => String(f.rfilename || '')) : [];
    if (!files.length) return { ok: true };
    if (!files.some(f => /\.onnx$/i.test(f))) return { ok: false, reason: 'il repo non contiene file ONNX' };
    return { ok: true };
  } catch (e) {
    return { ok: true };
  }
}

async function getEstimator(modelId) {
  const device = await pickDevice();
  const key = modelId + '|' + device;
  if (estimators.has(key)) { setProgress(30, 'modello in memoria'); return estimators.get(key); }
  setStatus(`Preparo il modello su ${device === 'webgpu' ? 'GPU' : 'CPU'}. Al primo uso viene scaricato e messo in cache locale.`);
  setProgress(3, 'modello');
  const onProgress = (ev) => {
    const raw = Number(ev && ev.progress);
    if (Number.isFinite(raw)) setProgress(3 + (raw / 100) * 27, 'scarico modello');
  };

  const check = await verifyRepo(modelId);
  if (!check.ok) {
    const err = new Error(`${modelId}: ${check.reason}. Scegline un altro.`);
    err.preflight = true;
    throw err;
  }

  try {
    const est = await pipeline('depth-estimation', modelId, { device, progress_callback: onProgress });
    estimators.set(key, est);
    refreshCacheInfo();
    return est;
  } catch (e) {
    if (device === 'webgpu') {
      try { localStorage.setItem(FORCE_WASM, '1'); } catch (err) { /* storage negato */ }
      e.recoverable = true;
    }
    throw e;
  }
}

async function predictFloat(est, canvas) {
  const out = await est(canvas);
  const t = out.predicted_depth;
  const dims = t.dims;
  const h = dims[dims.length - 2];
  const w = dims[dims.length - 1];
  const data = t.data instanceof Float32Array ? t.data : Float32Array.from(t.data);
  return { data, width: w, height: h };
}

function normalize(field) {
  let min = Infinity;
  let max = -Infinity;
  const d = field.data;
  for (let i = 0; i < d.length; i++) { if (d[i] < min) min = d[i]; if (d[i] > max) max = d[i]; }
  const span = max - min || 1;
  for (let i = 0; i < d.length; i++) d[i] = (d[i] - min) / span;
  return field;
}

function sampleBilinear(field, fx, fy) {
  const { data, width, height } = field;
  const x = Math.max(0, Math.min(width - 1.001, fx));
  const y = Math.max(0, Math.min(height - 1.001, fy));
  const x0 = Math.floor(x);
  const y0 = Math.floor(y);
  const x1 = Math.min(width - 1, x0 + 1);
  const y1 = Math.min(height - 1, y0 + 1);
  const tx = x - x0;
  const ty = y - y0;
  const a = data[y0 * width + x0];
  const b = data[y0 * width + x1];
  const c = data[y1 * width + x0];
  const e = data[y1 * width + x1];
  return (a * (1 - tx) + b * tx) * (1 - ty) + (c * (1 - tx) + e * tx) * ty;
}

function resampleField(field, w, h) {
  if (field.width === w && field.height === h) return field;
  const data = new Float32Array(w * h);
  const sx = field.width / w;
  const sy = field.height / h;
  for (let y = 0; y < h; y++) {
    const fy = (y + 0.5) * sy - 0.5;
    for (let x = 0; x < w; x++) {
      data[y * w + x] = sampleBilinear(field, (x + 0.5) * sx - 0.5, fy);
    }
  }
  return { data, width: w, height: h };
}

function boxDownsample(field, maxSide) {
  const scale = Math.min(1, maxSide / Math.max(field.width, field.height));
  if (scale >= 1) return field;
  const w = Math.max(1, Math.round(field.width * scale));
  const h = Math.max(1, Math.round(field.height * scale));
  const data = new Float32Array(w * h);
  const bx = field.width / w;
  const by = field.height / h;
  for (let y = 0; y < h; y++) {
    const sy0 = Math.floor(y * by);
    const sy1 = Math.min(field.height, Math.max(sy0 + 1, Math.floor((y + 1) * by)));
    for (let x = 0; x < w; x++) {
      const sx0 = Math.floor(x * bx);
      const sx1 = Math.min(field.width, Math.max(sx0 + 1, Math.floor((x + 1) * bx)));
      let sum = 0;
      let n = 0;
      for (let sy = sy0; sy < sy1; sy++) {
        const row = sy * field.width;
        for (let sx = sx0; sx < sx1; sx++) { sum += field.data[row + sx]; n++; }
      }
      data[y * w + x] = n ? sum / n : 0;
    }
  }
  return { data, width: w, height: h };
}

const smoothstep = (t) => { const v = clamp01(t); return v * v * (3 - 2 * v); };

async function runSingle(est, out) {
  setProgress(35, 'analisi');
  const infer = fitSize(out.w, out.h, 1536);
  const canvas = scaledCanvas(sourceImage, 0, 0, srcW, srcH, infer.w, infer.h);
  const field = normalize(await predictFloat(est, canvas));
  setProgress(90, 'ricampiono');
  return resampleField(field, out.w, out.h);
}

class Cancelled extends Error {
  constructor() { super('interrotto'); this.cancelled = true; }
}

function formatEta(ms) {
  const sec = Math.round(ms / 1000);
  if (sec < 60) return sec + 's';
  return Math.floor(sec / 60) + 'm ' + String(sec % 60).padStart(2, '0') + 's';
}

async function runTiled(est, out, grid) {
  const overlap = 0.18;
  const natW = srcW;
  const natH = srcH;

  setProgress(33, 'passata globale');
  const g = fitSize(natW, natH, 512);
  const globalField = await predictFloat(est, scaledCanvas(sourceImage, 0, 0, natW, natH, g.w, g.h));
  const gd = globalField.data;
  const gw = globalField.width;
  const gh = globalField.height;

  const acc = new Float32Array(out.w * out.h);
  const wacc = new Float32Array(out.w * out.h);
  const stepX = out.w / grid;
  const stepY = out.h / grid;
  const marginX = stepX * overlap;
  const marginY = stepY * overlap;
  const total = grid * grid;
  let done = 0;
  const started = performance.now();

  for (let gy = 0; gy < grid; gy++) {
    for (let gx = 0; gx < grid; gx++) {
      if (cancelRequested) throw new Cancelled();

      const x0 = Math.max(0, Math.round(gx * stepX - marginX));
      const x1 = Math.min(out.w, Math.round((gx + 1) * stepX + marginX));
      const y0 = Math.max(0, Math.round(gy * stepY - marginY));
      const y1 = Math.min(out.h, Math.round((gy + 1) * stepY + marginY));
      const boxW = x1 - x0;
      const boxH = y1 - y0;

      // Il modello ridimensiona comunque a circa 518px al suo interno, quindi dare
      // in pasto una tela piu' grande non aggiunge dettaglio: aggiunge solo
      // l'interpolazione che la libreria fa per riportare l'output alla misura di
      // ingresso. Il reingrandimento lo faccio io qui sotto, dove serve.
      const ts = Math.min(1, 518 / Math.max(boxW, boxH));
      const eta = done > 0 ? ` · resta ${formatEta(((performance.now() - started) / done) * (total - done))}` : '';
      setProgress(35 + (done / total) * 55, `tile ${done + 1}/${total}${eta}`);

      const tile = await predictFloat(est, scaledCanvas(
        sourceImage,
        (x0 / out.w) * natW, (y0 / out.h) * natH,
        (boxW / out.w) * natW, (boxH / out.h) * natH,
        boxW * ts, boxH * ts,
      ));
      const td = tile.data;
      const tw = tile.width;
      const th = tile.height;

      // Tabelle di campionamento precalcolate: nel ciclo interno non resta
      // nessuna chiamata di funzione ne' Math.floor per pixel.
      const cx0 = new Int32Array(boxW);
      const cx1 = new Int32Array(boxW);
      const ctx0 = new Float32Array(boxW);
      const wxArr = new Float32Array(boxW);
      const leftM = gx > 0 ? marginX * 2 : 0;
      const rightM = gx < grid - 1 ? marginX * 2 : 0;
      const topM = gy > 0 ? marginY * 2 : 0;
      const botM = gy < grid - 1 ? marginY * 2 : 0;

      for (let x = 0; x < boxW; x++) {
        const fx = Math.min(tw - 1.001, (x / boxW) * tw);
        const i0 = fx | 0;
        cx0[x] = i0;
        cx1[x] = i0 + 1 < tw ? i0 + 1 : tw - 1;
        ctx0[x] = fx - i0;
        let wx = 1;
        if (leftM > 0) wx = Math.min(wx, smoothstep(x / leftM));
        if (rightM > 0) wx = Math.min(wx, smoothstep((boxW - 1 - x) / rightM));
        wxArr[x] = wx;
      }

      // Allineamento affine alla passata globale, minimi quadrati su un sottocampione.
      let sT = 0, sG = 0, sTT = 0, sTG = 0, n = 0;
      for (let y = 0; y < boxH; y += 4) {
        const fy = Math.min(th - 1.001, (y / boxH) * th);
        const j0 = fy | 0;
        const j1 = j0 + 1 < th ? j0 + 1 : th - 1;
        const ty = fy - j0;
        const gyf = Math.min(gh - 1.001, ((y0 + y) / out.h) * gh);
        const k0 = gyf | 0;
        const k1 = k0 + 1 < gh ? k0 + 1 : gh - 1;
        const gty = gyf - k0;
        for (let x = 0; x < boxW; x += 4) {
          const a0 = td[j0 * tw + cx0[x]];
          const b0 = td[j0 * tw + cx1[x]];
          const a1 = td[j1 * tw + cx0[x]];
          const b1 = td[j1 * tw + cx1[x]];
          const fx = ctx0[x];
          const t = (a0 + (b0 - a0) * fx) * (1 - ty) + (a1 + (b1 - a1) * fx) * ty;

          const gxf = Math.min(gw - 1.001, ((x0 + x) / out.w) * gw);
          const m0 = gxf | 0;
          const m1 = m0 + 1 < gw ? m0 + 1 : gw - 1;
          const gtx = gxf - m0;
          const c0 = gd[k0 * gw + m0];
          const d0 = gd[k0 * gw + m1];
          const c1 = gd[k1 * gw + m0];
          const d1 = gd[k1 * gw + m1];
          const gg = (c0 + (d0 - c0) * gtx) * (1 - gty) + (c1 + (d1 - c1) * gtx) * gty;

          sT += t; sG += gg; sTT += t * t; sTG += t * gg; n++;
        }
      }
      const denom = n * sTT - sT * sT;
      let a = 1;
      let b = 0;
      if (Math.abs(denom) > 1e-9) {
        a = (n * sTG - sT * sG) / denom;
        b = (sG - a * sT) / n;
        if (!Number.isFinite(a) || a <= 1e-6) { a = 1; b = 0; }
      }

      for (let y = 0; y < boxH; y++) {
        let wy = 1;
        if (topM > 0) wy = Math.min(wy, smoothstep(y / topM));
        if (botM > 0) wy = Math.min(wy, smoothstep((boxH - 1 - y) / botM));
        const fy = Math.min(th - 1.001, (y / boxH) * th);
        const j0 = fy | 0;
        const j1 = j0 + 1 < th ? j0 + 1 : th - 1;
        const ty = fy - j0;
        const r0 = j0 * tw;
        const r1 = j1 * tw;
        const row = (y0 + y) * out.w + x0;
        for (let x = 0; x < boxW; x++) {
          const i0 = cx0[x];
          const i1 = cx1[x];
          const fx = ctx0[x];
          const top = td[r0 + i0];
          const topR = td[r0 + i1];
          const bot = td[r1 + i0];
          const botR = td[r1 + i1];
          const v = (top + (topR - top) * fx) * (1 - ty) + (bot + (botR - bot) * fx) * ty;
          const w = wxArr[x] * wy;
          const weight = w > 1e-4 ? w : 1e-4;
          const idx = row + x;
          acc[idx] += (a * v + b) * weight;
          wacc[idx] += weight;
        }
      }
      done++;
      await new Promise(r => setTimeout(r, 0));
    }
  }

  for (let i = 0; i < acc.length; i++) acc[i] = wacc[i] > 0 ? acc[i] / wacc[i] : 0;
  setProgress(92, 'normalizzo');
  return normalize({ data: acc, width: out.w, height: out.h });
}

// L'istogramma del grafico ha 160 intervalli, che bastano per disegnarlo ma non
// per costruire la curva di equalizzazione: sulla fascia delle montagne ne
// cadevano solo 12, e tra un punto e l'altro la curva tracciava segmenti dritti.
// Erano quelle faccette a sembrare sgranatura.
//
// Qui ne uso 1024, e li liscio: senza lisciatura un istogramma cosi' fine
// diventa frastagliato e il rimedio peggiora il male.
const EQ_BINS = 1024;
let eqHistogram = null;

function computeEqHistogram(field) {
  const raw = new Float64Array(EQ_BINS);
  const d = field.data;
  for (let i = 0; i < d.length; i++) raw[Math.floor(clamp01(d[i]) * (EQ_BINS - 1))]++;

  // lisciatura gaussiana, tre passate di media mobile
  const R = 6;
  let a = raw;
  let b = new Float64Array(EQ_BINS);
  for (let pass = 0; pass < 3; pass++) {
    for (let i = 0; i < EQ_BINS; i++) {
      let sum = 0;
      for (let k = -R; k <= R; k++) {
        const j = i + k;
        sum += a[j < 0 ? 0 : j >= EQ_BINS ? EQ_BINS - 1 : j];
      }
      b[i] = sum / (2 * R + 1);
    }
    const t = a; a = b; b = t;
  }
  eqHistogram = a;
}

function computeHistogram(field) {
  const bins = 160;
  const hist = new Float32Array(bins);
  const d = field.data;
  for (let i = 0; i < d.length; i++) hist[Math.floor(clamp01(d[i]) * (bins - 1))]++;
  histogram = hist;
  const c = new Float32Array(bins);
  let acc = 0;
  for (let i = 0; i < bins; i++) { acc += hist[i]; c[i] = acc / d.length; }
  cdf = c;
}

generateBtn.addEventListener('click', async () => {
  if (busy) {
    cancelRequested = true;
    setStatus('Interrompo appena finisce il tile in corso.');
    return;
  }
  if (!sourceImage || embeddedBlock) return;
  busy = true;
  cancelRequested = false;
  generateBtn.textContent = 'Interrompi';
  try {
    const est = await getEstimator(controls.modelSelect.value);
    setStatus('Analisi in corso. Non chiudere la pagina.');
    const out = targetSize(srcW, srcH, outputLongSide());
    const grid = Number(controls.detail.value);
    fullDepth = grid > 1 ? await runTiled(est, out, grid) : await runSingle(est, out);
    setProgress(94, 'raffino i contorni');
    await new Promise(r => setTimeout(r, 0));
    try {
      const guide = buildGuide(fullDepth.width, fullDepth.height);
      const radius = Math.max(4, Math.min(32, Math.round(Math.max(fullDepth.width, fullDepth.height) / 128)));
      fullRefined = guidedRefine(fullDepth, guide, radius, 1e-4);
    } catch (e) {
      console.warn('raffinamento non riuscito, uso la mappa grezza', e);
      fullRefined = null;
    }
    proxyDepth = boxDownsample(fullDepth, 1400);
    proxyRefined = fullRefined ? boxDownsample(fullRefined, 1400) : null;
    computeHistogram(proxyDepth);
    computeEqHistogram(fullDepth);
    syncValsFromPct();
    downloadBtn.disabled = false;
    setProgress(100, '');
    setStatus(`Depth map pronta, ${fullDepth.width}×${fullDepth.height} px.`, 'ok');
    drawInstrument();
    renderPreview();
    setView('depth');
  } catch (e) {
    if (e && e.cancelled) {
      setStatus('Interrotto.');
      setProgress(0, '');
    } else {
      console.error(e);
      const stack = (e && e.stack ? String(e.stack) : '').split('\n').slice(0, 3).join('\n');
      console.error('diagnostica:', envReport(), '\n', stack);
      // Dopo un fallimento la catena di init della libreria resta rifiutata,
      // quindi qualsiasi nuovo tentativo in questa pagina darebbe lo stesso errore.
      const hint = e && e.preflight ? '' : e && e.recoverable
        ? '\nLa GPU non e\u2019 utilizzabile qui. Ricarica la pagina: al prossimo avvio uso la CPU.'
        : '\nRicarica la pagina prima di riprovare.';
      setStatus(`Elaborazione fallita: ${e && e.message ? e.message : e}${hint}\n\n${envReport()}\n${stack}`, 'err');
      setProgress(0, '');
    }
  } finally {
    busy = false;
    cancelRequested = false;
    generateBtn.textContent = 'Genera depth map';
    generateBtn.disabled = embeddedBlock;
  }
});

/* ---------- resa ---------- */

// Sfocatura fatta a mano sul campo di profondita', non sul canvas. Tre motivi:
// ctx.filter non e' disponibile ovunque e fallisce in silenzio; sfocare i valori
// di profondita' prima della mappatura evita di mescolare colori della palette;
// e cosi' il raggio si puo' riscalare sull'anteprima, che altrimenti mostrerebbe
// una sfocatura diversa da quella del file esportato.
function boxesForGauss(sigma, n) {
  const wIdeal = Math.sqrt((12 * sigma * sigma / n) + 1);
  let wl = Math.floor(wIdeal);
  if (wl % 2 === 0) wl--;
  const wu = wl + 2;
  const mIdeal = (12 * sigma * sigma - n * wl * wl - 4 * n * wl - 3 * n) / (-4 * wl - 4);
  const m = Math.round(mIdeal);
  const sizes = [];
  for (let i = 0; i < n; i++) sizes.push(((i < m ? wl : wu) - 1) / 2);
  return sizes;
}

function boxBlurH(src, dst, w, h, r) {
  if (r < 1) { dst.set(src); return; }
  const norm = 1 / (2 * r + 1);
  for (let y = 0; y < h; y++) {
    const row = y * w;
    let acc = 0;
    for (let i = -r; i <= r; i++) acc += src[row + Math.min(w - 1, Math.max(0, i))];
    for (let x = 0; x < w; x++) {
      dst[row + x] = acc * norm;
      acc += src[row + Math.min(w - 1, x + r + 1)] - src[row + Math.max(0, x - r)];
    }
  }
}

function boxBlurV(src, dst, w, h, r) {
  if (r < 1) { dst.set(src); return; }
  const norm = 1 / (2 * r + 1);
  for (let x = 0; x < w; x++) {
    let acc = 0;
    for (let i = -r; i <= r; i++) acc += src[Math.min(h - 1, Math.max(0, i)) * w + x];
    for (let y = 0; y < h; y++) {
      dst[y * w + x] = acc * norm;
      acc += src[Math.min(h - 1, y + r + 1) * w + x] - src[Math.max(0, y - r) * w + x];
    }
  }
}

function blurField(field, sigma) {
  if (!(sigma > 0.3)) return field;
  const { width: w, height: h } = field;
  let a = Float32Array.from(field.data);
  let b = new Float32Array(w * h);
  for (const r of boxesForGauss(sigma, 3)) {
    boxBlurH(a, b, w, h, r);
    boxBlurV(b, a, w, h, r);
  }
  return { data: a, width: w, height: h };
}

// Rumore di valore su reticolo, con seme fisso e coordinate espresse nei pixel
// del file finale. Due conseguenze: l'anteprima mostra la stessa grana che
// esporterai, e due esportazioni di fila sono identiche byte per byte.
const GRAIN_SEED = 0x9e3779b9 | 0;

function hash2(x, y) {
  let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + GRAIN_SEED;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h = h ^ (h >>> 16);
  return (h >>> 0) / 4294967295;
}

// Cella da 1px: rumore bianco, come Aggiungi disturbo di Photoshop. Sopra 1px il
// valore viene interpolato tra i nodi del reticolo con smoothstep, quindi la
// grana ha una dimensione leggibile e resta coerente invece di sfarfallare.
function grainAt(x, y, cell) {
  if (cell <= 1) return hash2(x, y);
  const gx = x / cell;
  const gy = y / cell;
  const ix = Math.floor(gx);
  const iy = Math.floor(gy);
  const fx = gx - ix;
  const fy = gy - iy;
  const ux = fx * fx * (3 - 2 * fx);
  const uy = fy * fy * (3 - 2 * fy);
  const a = hash2(ix, iy);
  const b = hash2(ix + 1, iy);
  const c = hash2(ix, iy + 1);
  const d = hash2(ix + 1, iy + 1);
  return (a + (b - a) * ux) * (1 - uy) + (c + (d - c) * ux) * uy;
}

// Filtro guidato, versione veloce. Il modello vede l'immagine a circa 518px,
// quindi i contorni della profondita' escono sfocati e spostati rispetto a
// quelli della foto. Questo filtro usa la foto come riferimento: dove la foto ha
// un bordo netto obbliga la profondita' a esserlo nello stesso punto, dove la
// foto e' uniforme non tocca nulla.
//
// I coefficienti si calcolano su una copia ridotta e si applicano a piena
// risoluzione: stesso risultato, memoria e tempo molto minori.
function boxMean(src, dst, tmp, w, h, r) {
  boxBlurH(src, tmp, w, h, r);
  boxBlurV(tmp, dst, w, h, r);
}

function guidedRefine(depth, guide, radius, eps) {
  const W = depth.width;
  const H = depth.height;
  const small = Math.min(1, 1024 / Math.max(W, H));
  const sw = Math.max(8, Math.round(W * small));
  const sh = Math.max(8, Math.round(H * small));
  const r = Math.max(2, Math.round(radius * small));

  const p = resampleField(depth, sw, sh).data;
  const I = resampleField({ data: guide, width: W, height: H }, sw, sh).data;
  const n = sw * sh;
  const Ip = new Float32Array(n);
  const II = new Float32Array(n);
  for (let i = 0; i < n; i++) { Ip[i] = I[i] * p[i]; II[i] = I[i] * I[i]; }

  const tmp = new Float32Array(n);
  const mI = new Float32Array(n);
  const mP = new Float32Array(n);
  const mIp = new Float32Array(n);
  const mII = new Float32Array(n);
  boxMean(I, mI, tmp, sw, sh, r);
  boxMean(p, mP, tmp, sw, sh, r);
  boxMean(Ip, mIp, tmp, sw, sh, r);
  boxMean(II, mII, tmp, sw, sh, r);

  const a = new Float32Array(n);
  const b = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const cov = mIp[i] - mI[i] * mP[i];
    const varI = mII[i] - mI[i] * mI[i];
    const ai = cov / (varI + eps);
    a[i] = ai;
    b[i] = mP[i] - ai * mI[i];
  }
  const mA = new Float32Array(n);
  const mB = new Float32Array(n);
  boxMean(a, mA, tmp, sw, sh, r);
  boxMean(b, mB, tmp, sw, sh, r);

  const aFull = resampleField({ data: mA, width: sw, height: sh }, W, H).data;
  const bFull = resampleField({ data: mB, width: sw, height: sh }, W, H).data;
  const out = new Float32Array(W * H);
  for (let i = 0; i < out.length; i++) out[i] = aFull[i] * guide[i] + bFull[i];
  return { data: out, width: W, height: H };
}

// luminanza della sorgente alla misura della mappa, serve come riferimento
function buildGuide(w, h) {
  const c = scaledCanvas(sourceImage, 0, 0, srcW, srcH, w, h);
  const px = c.getContext('2d').getImageData(0, 0, w, h).data;
  const g = new Float32Array(w * h);
  for (let i = 0; i < g.length; i++) {
    const j = i * 4;
    g[i] = (0.2126 * px[j] + 0.7152 * px[j + 1] + 0.0722 * px[j + 2]) / 255;
  }
  return g;
}

// La curva e' una tabella di 256 voci, ma la profondita' e' in virgola mobile.
// Arrotondando all'indice piu' vicino si buttavano via tutti i valori intermedi:
// una fascia stretta espansa dalla curva usciva a scalini invece che sfumata.
// Interpolando tra due voci la precisione del campo originale si conserva.
function sampleCurve(lut, t) {
  const p = clamp01(t) * 255;
  const j = p | 0;
  const f = p - j;
  const a = lut[j];
  const b = lut[j + 1 < 256 ? j + 1 : 255];
  return a + (b - a) * f;
}

function renderField(field) {
  // Il cursore esprime pixel del file finale: sull'anteprima ridotta il raggio
  // va riscalato, altrimenti quello che vedi non e' quello che esporti.
  const blurPx = Number(controls.blur.value);
  const scale = fullDepth && fullDepth.width ? field.width / fullDepth.width : 1;

  // Il cursore Contorni fonde la mappa grezza con quella raffinata, cosi' puoi
  // dosarlo senza rifare l'inferenza.
  const edgeMix = Number(controls.edges.value) / 100;
  const refined = field === fullDepth ? fullRefined : field === proxyDepth ? proxyRefined : null;
  let base = field;
  if (edgeMix > 0 && refined && refined.data.length === field.data.length) {
    const mixed = new Float32Array(field.data.length);
    for (let i = 0; i < mixed.length; i++) {
      mixed[i] = field.data[i] + (refined.data[i] - field.data[i]) * edgeMix;
    }
    base = { data: mixed, width: field.width, height: field.height };
  }
  const work = blurPx > 0 ? blurField(base, blurPx * scale) : base;
  const low = lowVal;
  const span = Math.max(1e-6, highVal - lowVal);
  // L'equalizzazione agisce PRIMA della curva manuale, cosi' i due controlli si
  // sommano invece di combattersi: la curva disegnata a mano continua a fare
  // quello che ci si aspetta anche a equalizzazione attiva.
  let curve = buildCurveLut();
  const eqAmt = Number(controls.equalize.value) / 100;
  if (eqAmt > 0) {
    const eq = buildEqualizeLut(eqClipFor(eqAmt));
    if (eq) {
      const combined = new Float32Array(256);
      for (let i = 0; i < 256; i++) {
        const t = (i / 255) * (1 - eqAmt) + eq[i] * eqAmt;
        const pos = clamp01(t) * 255;
        const j = Math.floor(pos);
        const f = pos - j;
        const a = curve[j];
        const b = curve[Math.min(255, j + 1)];
        combined[i] = a + (b - a) * f;
      }
      curve = combined;
    }
  }
  const pal = paletteLut(controls.palette.value);
  const { width, height } = field;
  const data = work.data;
  const imageData = new ImageData(width, height);
  const dst = imageData.data;

  // La grana perturba il livello tonale prima della lettura della palette, non i
  // canali RGB dopo: resta monocromatica rispetto alla rampa invece di sporcare
  // i colori, e su scala di grigi si comporta esattamente come la grana classica.
  const grainAmt = Number(controls.grain.value);
  const grainCell = Number(controls.grainSize.value);
  const outScale = scale > 0 ? 1 / scale : 1;
  // L'interpolazione tra i nodi del reticolo riduce la varianza, quindi a parita'
  // di cursore una grana larga risulterebbe piu' debole. Compenso, cosi' la
  // percentuale indica sempre la stessa forza.
  const cellGain = grainCell > 1 ? 1.6 - 0.6 / grainCell : 1;
  const amp = (grainAmt / 100) * 80 * cellGain;

  if (grainAmt <= 0) {
    for (let i = 0; i < data.length; i++) {
      let t = clamp01((data[i] - low) / span);
      if (invert) t = 1 - t;
      const v = Math.round(sampleCurve(curve, t) * 255);
      const j = i * 4;
      dst[j] = pal[v * 3];
      dst[j + 1] = pal[v * 3 + 1];
      dst[j + 2] = pal[v * 3 + 2];
      dst[j + 3] = 255;
    }
  } else {
    for (let y = 0; y < height; y++) {
      const ny = y * outScale;
      const row = y * width;
      for (let x = 0; x < width; x++) {
        const i = row + x;
        let t = clamp01((data[i] - low) / span);
        if (invert) t = 1 - t;
        let v = sampleCurve(curve, t) * 255 + (grainAt(x * outScale, ny, grainCell) - 0.5) * 2 * amp;
        v = v < 0 ? 0 : v > 255 ? 255 : Math.round(v);
        const j = i * 4;
        dst[j] = pal[v * 3];
        dst[j + 1] = pal[v * 3 + 1];
        dst[j + 2] = pal[v * 3 + 2];
        dst[j + 3] = 255;
      }
    }
  }

  const out = document.createElement('canvas');
  out.width = width;
  out.height = height;
  out.getContext('2d').putImageData(imageData, 0, 0);
  return out;
}

function renderPreview() {
  if (!proxyDepth) return;
  depthCanvas = renderField(proxyDepth);
  if (view === 'depth') paintView();
}

function paintView() {
  viewport.innerHTML = '';
  if (view === 'source' && sourcePreview) {
    sourcePreview.className = 'fade';
    viewport.appendChild(sourcePreview);
    $('dims').textContent = `${srcW} × ${srcH}`;
    return;
  }
  if (view === 'depth' && depthCanvas) {
    depthCanvas.className = 'fade';
    viewport.appendChild(depthCanvas);
    $('dims').textContent = `anteprima ${depthCanvas.width} × ${depthCanvas.height} · file ${fullDepth.width} × ${fullDepth.height}`;
    return;
  }
  const span = document.createElement('span');
  span.className = 'empty';
  span.textContent = sourceImage ? 'nessuna depth map' : 'nessuna immagine';
  viewport.appendChild(span);
  $('dims').textContent = '';
}

function setView(next) {
  view = next;
  $('viewDepth').setAttribute('aria-pressed', String(next === 'depth'));
  $('viewSource').setAttribute('aria-pressed', String(next === 'source'));
  paintView();
}

$('viewDepth').addEventListener('click', () => setView('depth'));
$('viewSource').addEventListener('click', () => setView('source'));

function schedulePreview() {
  if (!proxyDepth) return;
  clearTimeout(renderTimer);
  renderTimer = setTimeout(renderPreview, 110);
}

const UNIT_KEY = 'depthmap-unit-v1';
let sizeUnit = 'px';

const dpiValue = () => Math.min(1200, Math.max(72, Number(controls.dpi.value) || 300));
const mmToPx = (mm, dpi) => Math.round((mm / 25.4) * dpi);
const pxToMm = (px, dpi) => (px / dpi) * 25.4;

// Il motore ragiona solo in pixel. I millimetri sono una vista su quel numero,
// non un percorso di calcolo diverso: si convertono qui e basta.
function outputLongSide() {
  const raw = Number(controls.outSize.value) || 0;
  const px = sizeUnit === 'mm' ? mmToPx(raw, dpiValue()) : Math.round(raw);
  return Math.min(8000, Math.max(256, px));
}

function setUnit(next, convert) {
  if (next === sizeUnit) return;
  const dpi = dpiValue();
  const raw = Number(controls.outSize.value) || 0;
  if (convert && raw > 0) {
    controls.outSize.value = next === 'mm'
      ? String(Math.round(pxToMm(raw, dpi) * 10) / 10)
      : String(mmToPx(raw, dpi));
  }
  sizeUnit = next;
  controls.outSize.step = next === 'mm' ? '0.5' : '1';
  controls.outSize.min = next === 'mm' ? '20' : '256';
  controls.outSize.max = next === 'mm' ? '2000' : '8000';
  $('outUnit').textContent = next;
  $('unitPx').setAttribute('aria-pressed', String(next === 'px'));
  $('unitMm').setAttribute('aria-pressed', String(next === 'mm'));
  try { localStorage.setItem(UNIT_KEY, next); } catch (e) { /* storage negato */ }
  updateSummary();
}

// Dice la conseguenza delle scelte fatte sopra: quante inferenze, che misura in
// pixel e che misura fisica alla risoluzione scelta.
// I tile aiutano su un soggetto ravvicinato e pieno di dettaglio, ma su una
// scena ampia peggiorano: ogni riquadro viene normalizzato sul proprio
// intervallo e il riallineamento non recupera del tutto. Meglio dirlo qui che
// lasciarlo scoprire a chi usa il tool.
function updateDetailNote() {
  const el = $('detailNote');
  el.textContent = Number(controls.detail.value) > 1
    ? 'Piu\u2019 dettaglio fine, ma su paesaggi e scene ampie il risultato peggiora.'
    : '';
}

function updateSummary() {
  const el = $('summary');
  if (!srcW) { el.textContent = 'nessuna immagine'; return; }
  const grid = Number(controls.detail.value);
  const out = targetSize(srcW, srcH, outputLongSide());
  const passes = grid > 1 ? grid * grid + 1 : 1;
  const dpi = dpiValue();
  const heavy = out.w * out.h > 12e6 ? ' · file pesante' : '';
  el.textContent = `${passes} ${passes === 1 ? 'inferenza' : 'inferenze'} · ${out.w} × ${out.h} px · `
    + `${pxToMm(out.w, dpi).toFixed(0)} × ${pxToMm(out.h, dpi).toFixed(0)} mm a ${dpi} dpi${heavy}`;
}

function readLabels() {
  $('blurVal').textContent = `${controls.blur.value} px`;
  $('edgesVal').textContent = `${controls.edges.value}%`;
  $('equalizeVal').textContent = `${controls.equalize.value}%`;
  $('grainVal').textContent = `${controls.grain.value}%`;
  $('grainSizeVal').textContent = `${controls.grainSize.value} px`;
  $('qualityVal').textContent = `${controls.quality.value}%`;
}

controls.detail.addEventListener('change', () => { updateSummary(); updateDetailNote(); });
controls.outSize.addEventListener('input', updateSummary);
controls.dpi.addEventListener('input', updateSummary);
$('unitPx').addEventListener('click', () => setUnit('px', true));
$('unitMm').addEventListener('click', () => setUnit('mm', true));
controls.edges.addEventListener('input', () => { readLabels(); schedulePreview(); });
controls.equalize.addEventListener('input', () => { readLabels(); drawInstrument(); schedulePreview(); });
controls.blur.addEventListener('input', () => { readLabels(); schedulePreview(); });
controls.grain.addEventListener('input', () => { readLabels(); schedulePreview(); });
controls.grainSize.addEventListener('input', () => { readLabels(); schedulePreview(); });
controls.quality.addEventListener('input', readLabels);
controls.palette.addEventListener('change', () => { drawInstrument(); schedulePreview(); });

// Senza questo, un JPEG da canvas nasce a 72 dpi e InDesign o Photoshop lo
// piazzano alla misura fisica sbagliata. Il segmento APP0 JFIF sta subito dopo
// il SOI e ha offset fissi: unita' a 13, Xdensity a 14-15, Ydensity a 16-17.
function setJpegDensity(buffer, dpi) {
  const b = new Uint8Array(buffer);
  const isJfif = b[0] === 0xFF && b[1] === 0xD8 && b[2] === 0xFF && b[3] === 0xE0
    && b[6] === 0x4A && b[7] === 0x46 && b[8] === 0x49 && b[9] === 0x46 && b[10] === 0x00;
  if (!isJfif) return { buffer, written: false };
  b[13] = 1;
  b[14] = (dpi >> 8) & 255;
  b[15] = dpi & 255;
  b[16] = (dpi >> 8) & 255;
  b[17] = dpi & 255;
  return { buffer: b.buffer, written: true };
}

downloadBtn.addEventListener('click', async () => {
  if (!fullDepth || busy) return;
  busy = true;
  downloadBtn.disabled = true;
  setStatus('Preparo il JPG a piena risoluzione.');
  try {
    await new Promise(r => setTimeout(r, 20));
    const canvas = renderField(fullDepth);
    const blob = await new Promise((res, rej) => {
      canvas.toBlob(b => b ? res(b) : rej(new Error('canvas vuoto')), 'image/jpeg', Number(controls.quality.value) / 100);
    });
    const dpi = dpiValue();
    const patched = setJpegDensity(await blob.arrayBuffer(), dpi);
    const finalBlob = new Blob([patched.buffer], { type: 'image/jpeg' });
    const url = URL.createObjectURL(finalBlob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${sourceName}-depth.jpg`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    const mm = `${pxToMm(canvas.width, dpi).toFixed(0)} × ${pxToMm(canvas.height, dpi).toFixed(0)} mm`;
    setStatus(patched.written
      ? `Salvato ${canvas.width}×${canvas.height} px a ${dpi} dpi, cioe' ${mm}. ${humanSize(finalBlob.size)}.`
      : `Salvato ${canvas.width}×${canvas.height} px, ${humanSize(finalBlob.size)}. Densita' di stampa non scrivibile su questo browser.`, 'ok');
  } catch (e) {
    setStatus('Esportazione fallita: ' + (e && e.message ? e.message : e), 'err');
  } finally {
    busy = false;
    downloadBtn.disabled = false;
  }
});

$('clearCache').addEventListener('click', async () => {
  try {
    await idb('files', 'readwrite', s => { s.clear(); return null; });
    await idb('meta', 'readwrite', s => { s.clear(); return null; });
    estimators.clear();
    try { localStorage.removeItem(FORCE_WASM); } catch (e) { /* storage negato */ }
    await refreshCacheInfo();
    setStatus('Cache svuotata e ripiego su CPU azzerato. Il prossimo uso riscarica il modello e riprova la GPU.', 'ok');
  } catch (e) {
    setStatus('Non riesco a svuotare la cache.', 'err');
  }
});

// Se IndexedDB non accetta un ArrayBuffer (contesto file://, modalita' privata,
// storage negato) meglio scoprirlo subito e spegnere la cache, invece di lasciare
// che l'errore emerga a meta' del caricamento del modello.
async function selfTestCache() {
  try {
    await idb('files', 'readwrite', s2 => s2.put({ buffer: new ArrayBuffer(8), type: 'selftest' }, '__selftest__'));
    await idb('files', 'readwrite', s2 => s2.delete('__selftest__'));
  } catch (e) {
    env.useCustomCache = false;
    env.customCache = null;
    $('cacheInfo').textContent = 'cache non disponibile';
    console.warn('cache disattivata:', e.name, e.message);
  }
}

// In un'anteprima incorporata (iframe srcdoc, protocollo about:) l'origine e'
// opaca: niente IndexedDB, niente memoria condivisa, e il bridge dell'host prova
// a clonare oggetti che WebKit rifiuta. Meglio dirlo prima di far scaricare
// cento megabyte di modello per poi fallire.
const EMBEDDED = location.protocol === 'about:' || location.protocol === 'blob:';
const FRAMED = (() => { try { return window.top !== window.self; } catch (e) { return true; } })();

// Caricare e vedere l'immagine funziona anche qui: si blocca solo il calcolo.
if (EMBEDDED) {
  embeddedBlock = true;
  setStatus('Anteprima incorporata: puoi caricare e vedere l\u2019immagine, ma il motore di calcolo non puo\u2019 girare qui.\nScarica il file e aprilo come pagina per generare la depth map.', 'warn');
} else {
  if (FRAMED) console.warn('la pagina gira dentro un iframe: se il modello non parte, aprila in una scheda dedicata');
  selfTestCache();
}
// Elenco modelli dall'API pubblica di Hugging Face, filtrato per compito e per
// libreria. Nessuna chiave, nessun dato inviato: e' una GET con dei parametri.

// I nomi dei repo non dicono nulla a chi non segue la letteratura, quindi li
// classifico per famiglia. La distinzione che conta e' relativa contro metrica:
// la prima da' solo l'ordine di profondita', ed e' quella che serve per
// displacement e maschere; la seconda stima distanze in unita' reali, ma solo
// dentro il dominio su cui e' stata addestrata.
const FAMILIES = [
  {
    key: 'v2metric',
    test: /depth[-_]?anything.*metric|metric.*depth[-_]?anything/i,
    kind: 'metrica',
    label: 'Depth Anything metrica · distanze reali',
    text: 'Variante metrica di Depth Anything: restituisce distanze in unita\u2019 reali invece del solo ordine. Tarata su interni oppure su esterni, a seconda della versione.',
  },
  {
    key: 'v2',
    test: /depth[-_]?anything[-_.]?v2|dav2/i,
    kind: 'relativa',
    label: 'Depth Anything v2 · relativa',
    text: 'Il riferimento attuale su foto generiche. Bordi netti e pochi errori sui piani. Se non sai quale scegliere, questa.',
  },
  {
    key: 'v1',
    test: /depth[-_]?anything/i,
    kind: 'relativa',
    label: 'Depth Anything v1 · relativa',
    text: 'Generazione precedente. Transizioni piu\u2019 morbide e bordi meno definiti della v2.',
  },
  {
    key: 'marigold',
    test: /marigold/i,
    kind: 'relativa',
    label: 'Diffusione · relativa',
    text: 'Basata su diffusione. Molto dettagliata e molto lenta: richiede piu\u2019 passaggi per immagine.',
  },
  {
    key: 'metric',
    test: /zoe|metric3d|depth[-_]?pro|unidepth|metric/i,
    kind: 'metrica',
    label: 'Metriche · distanze reali',
    text: 'Stima distanze in unita\u2019 reali, non solo l\u2019ordine di profondita\u2019. Modelli grossi e lenti, utili solo se ti serve una scala vera.',
  },
  {
    key: 'glpn',
    test: /glpn/i,
    kind: 'metrica',
    label: 'GLPN · metrica, dominio ristretto',
    text: 'Addestrata su interni (NYU) o su strade (KITTI). Dentro quel dominio e\u2019 precisa, fuori sbanda parecchio.',
  },
  {
    key: 'dpt',
    test: /midas|dpt/i,
    kind: 'relativa',
    label: 'MiDaS / DPT · relativa',
    text: 'L\u2019architettura storica. Resa molto morbida, a passaggi graduali: comoda per nebbie e atmosfere, meno per i bordi.',
  },
];

const UNKNOWN_FAMILY = {
  key: 'other',
  kind: 'non classificato',
  label: 'Altri',
  text: 'Non rientra in nessuna famiglia che conosco: non so cosa aspettarmi.',
};

function familyOf(id) {
  for (const f of FAMILIES) if (f.test.test(id)) return f;
  return UNKNOWN_FAMILY;
}

function weightOf(id) {
  if (/tiny|small|[-_]s[-_]/i.test(id)) return { rank: 0, word: 'leggero' };
  if (/base|medium|[-_]b[-_]/i.test(id)) return { rank: 1, word: 'medio' };
  if (/large|giant|huge|[-_]l[-_]/i.test(id)) return { rank: 2, word: 'pesante' };
  return { rank: 1, word: 'peso ignoto' };
}

function updateModelNote() {
  const f = familyOf(controls.modelSelect.value);
  const w = weightOf(controls.modelSelect.value);
  const note = $('modelNote');
  note.innerHTML = '';
  const strong = document.createElement('b');
  strong.textContent = `${f.kind} · ${w.word}. `;
  note.appendChild(strong);
  note.appendChild(document.createTextNode(f.text));
}

controls.modelSelect.addEventListener('change', updateModelNote);

// L'elenco automatico da Hugging Face e' stato rimosso: proponeva repo che il
// browser non puo' eseguire. Qui restano solo modelli provati. Ripulisco anche
// l'elenco salvato dalle versioni precedenti.
try { localStorage.removeItem('depthmap-models-v1'); } catch (e) { /* storage negato */ }

buildPresetSelect('');
readLabels();
updateModelNote();
try {
  if (localStorage.getItem(UNIT_KEY) === 'mm') setUnit('mm', true);
} catch (e) { /* storage negato */ }
updateSummary();
updateDetailNote();
drawInstrument();
paintView();
refreshCacheInfo();
</script>
</body>
</html>
