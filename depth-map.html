<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Depth map</title>
<style>
  :root {
    color-scheme: dark;
    --void: #131518;
    --rail: #191c20;
    --sunk: #101215;
    --line: #272b31;
    --line-soft: #1f2328;
    --text: #e6e8ea;
    --dim: #868d96;
    --amber: #d9a441;
    --amber-dim: #7d5f26;
    --viewbox: #2b2b2b;
    --red: #d4674f;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Inter, sans-serif;
  }
  * { box-sizing: border-box; }
  html { height: 100%; }
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--void);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--amber); color: #17130a; }
  :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

  .topbar {
    position: relative;
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, var(--rail), var(--void));
  }
  .topbar::after {
    content: "";
    position: absolute;
    left: 0; right: 0;
    bottom: -1px;
    height: 1px;
    background: var(--amber);
    opacity: .34;
    pointer-events: none;
  }
  .wordmark {
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: .16em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .wordmark i {
    width: 9px; height: 9px;
    background: var(--amber);
    display: block;
    font-style: normal;
  }
  .fileinfo {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--dim);
    letter-spacing: .05em;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  .shell {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: 372px minmax(0, 1fr);
  }
  @media (max-width: 900px) {
    body { height: auto; overflow: auto; display: block; }
    .shell { grid-template-columns: 1fr; }
    .rail { border-right: 0; border-bottom: 1px solid var(--line); overflow: visible; }
    .stage { overflow: visible; }
    .viewport { min-height: 320px; }
    .viewport img, .viewport canvas { max-height: 60vh; }
  }

  .rail {
    border-right: 1px solid var(--line);
    background: var(--rail);
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 22px;
    overflow-y: auto;
    overscroll-behavior: contain;
  }
  .block { display: flex; flex-direction: column; gap: 12px; }
  .blocktitle {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: #aab1ba;
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0;
  }
  .blocktitle::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  .field { display: flex; flex-direction: column; gap: 7px; }
  .field > label {
    font-size: 12.5px;
    color: #c5cbd3;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 10px;
  }
  .field .num {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }

  select {
    width: 100%;
    appearance: none;
    background: var(--sunk) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='7'><path d='M0 0h10L5 7z' fill='%23868d96'/></svg>") no-repeat right 12px center;
    border: 1px solid var(--line);
    color: var(--text);
    font-family: var(--sans);
    font-size: 13.5px;
    padding: 10px 30px 10px 11px;
    border-radius: 6px;
    cursor: pointer;
  }
  select:hover { border-color: #363b43; }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 18px;
    background: transparent;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-runnable-track { height: 2px; background: var(--line); }
  input[type="range"]::-moz-range-track { height: 2px; background: var(--line); }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 13px; height: 13px;
    border-radius: 50%;
    background: var(--text);
    margin-top: -5.5px;
    border: 0;
  }
  input[type="range"]::-moz-range-thumb {
    width: 13px; height: 13px;
    border-radius: 50%;
    background: var(--text);
    border: 0;
  }
  input[type="range"]:hover::-webkit-slider-thumb { background: var(--amber); }
  input[type="range"]:hover::-moz-range-thumb { background: var(--amber); }

  button {
    font-family: var(--sans);
    font-size: 13.5px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--sunk);
    color: var(--text);
    padding: 11px 12px;
    cursor: pointer;
    transition: background .15s ease, border-color .15s ease, color .15s ease;
  }
  button:hover:not(:disabled) { border-color: #3a4048; background: #1b1e23; }
  button:disabled { opacity: .38; cursor: not-allowed; }
  button.primary {
    background: var(--amber);
    border-color: var(--amber);
    color: #17130a;
    font-weight: 600;
  }
  button.primary:hover:not(:disabled) { background: #e7b355; border-color: #e7b355; }
  button.tiny {
    padding: 7px 9px;
    font-size: 11.5px;
    font-family: var(--mono);
    letter-spacing: .04em;
    color: var(--dim);
  }
  button.tiny:hover:not(:disabled) { color: var(--text); }
  button.tiny[aria-pressed="true"] { color: var(--amber); border-color: var(--amber-dim); }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }

  .drop {
    border: 1px dashed #333941;
    border-radius: 8px;
    background: var(--sunk);
    padding: 22px 14px;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  .drop:hover, .drop.drag { border-color: var(--amber); background: #1c1a15; }
  .drop b { display: block; font-weight: 500; font-size: 13.5px; }
  .drop span { display: block; margin-top: 4px; font-size: 11.5px; color: var(--dim); font-family: var(--mono); letter-spacing: .04em; }
  input[type="file"] { display: none; }

  .instrument {
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--sunk);
    padding: 9px 9px 6px;
    touch-action: none;
  }
  #curve { display: block; width: 100%; height: auto; cursor: crosshair; }
  .legend {
    display: flex;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--dim);
    letter-spacing: .06em;
    padding: 4px 2px 0;
    font-variant-numeric: tabular-nums;
  }

  /* Secondo livello: rifiniture, non decisioni. Rientro con filo verticale,
     etichette in mono piu' piccole, controlli meno alti. */
  .sub {
    display: flex;
    flex-direction: column;
    gap: 11px;
    border-left: 1px solid var(--line);
    padding-left: 13px;
  }
  .sub > .field > label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .13em;
    text-transform: uppercase;
    color: var(--dim);
  }
  .sub select { padding: 8px 30px 8px 10px; font-size: 13px; }
  .summary {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: .05em;
    color: var(--amber);
    opacity: .8;
    font-variant-numeric: tabular-nums;
    padding-left: 13px;
    border-left: 1px solid var(--amber-dim);
  }
  .primary-slot { margin-top: 3px; }
  .linkbtn {
    border: 0;
    background: none;
    padding: 0;
    width: auto;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--dim);
    cursor: pointer;
  }
  .linkbtn:hover:not(:disabled) { color: var(--amber); background: none; }
  .linkbtn:disabled { opacity: .4; }

  .fieldhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .fieldhead label { margin: 0; }
  .seg.mini { border-radius: 5px; }
  .seg.mini button { padding: 4px 9px; font-size: 10px; letter-spacing: .12em; }
  .numrow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .inputwrap { position: relative; display: block; }
  .inputwrap input {
    width: 100%;
    background: var(--sunk);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 6px;
    padding: 8px 40px 8px 10px;
    font-family: var(--mono);
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    -moz-appearance: textfield;
  }
  .inputwrap input::-webkit-outer-spin-button,
  .inputwrap input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .inputwrap input:hover { border-color: #363b43; }
  .inputwrap em {
    position: absolute;
    right: 10px; top: 50%;
    transform: translateY(-50%);
    font-style: normal;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--dim);
    pointer-events: none;
  }
  .note { margin: 0; font-size: 11.5px; line-height: 1.45; color: var(--dim); }
  .note b { color: #c5cbd3; font-weight: 600; }

  .cacheline {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: .05em;
    color: var(--dim);
    border-top: 1px solid var(--line);
    padding-top: 12px;
    margin-top: auto;
  }
  .cacheline button { padding: 4px 8px; font-size: 10.5px; font-family: var(--mono); }

  .stage {
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-height: 0;
    overflow: hidden;
  }
  .stagehead { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
  .seg {
    display: inline-flex;
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
    background: var(--sunk);
  }
  .seg button {
    border: 0;
    border-radius: 0;
    background: transparent;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--dim);
    padding: 8px 14px;
  }
  .seg button[aria-pressed="true"] { background: #23262b; color: var(--text); }
  .dims {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--dim);
    letter-spacing: .06em;
    font-variant-numeric: tabular-nums;
  }

  .viewport {
    flex: 1 1 auto;
    min-height: 0;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--viewbox);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 22px;
    overflow: hidden;
    min-height: 320px;
  }
  .viewport img, .viewport canvas {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    display: block;
    box-shadow: 0 18px 50px rgba(0,0,0,.45);
  }
  .viewport .empty {
    font-family: var(--mono);
    font-size: 11.5px;
    letter-spacing: .08em;
    color: #7a7a7a;
    text-transform: uppercase;
  }
  .fade { animation: fade .28s ease both; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  .statusbar { display: flex; flex-direction: column; gap: 8px; }
  .statusbar .track { height: 2px; background: var(--line-soft); overflow: hidden; }
  .statusbar .track > div { height: 100%; width: 0; background: var(--amber); transition: width .25s ease; }
  .statusbar .line {
    display: flex;
    justify-content: space-between;
    gap: 14px;
    font-family: var(--mono);
    font-size: 11.5px;
    letter-spacing: .04em;
    color: var(--dim);
    font-variant-numeric: tabular-nums;
  }
  .statusbar .line.err { color: var(--red); }
  .statusbar .line.ok { color: var(--amber); }
  .statusbar .msg { white-space: pre-wrap; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="wordmark"><i></i> Depth map</div>
  <div class="fileinfo" id="fileinfo">nessun file</div>
</div>

<div class="shell">
  <aside class="rail">

    <div class="block">
      <h2 class="blocktitle">Sorgente</h2>
      <div class="drop" id="drop" tabindex="0" role="button">
        <b>Trascina un'immagine</b>
        <span>o clicca per sceglierla</span>
      </div>
      <input type="file" id="fileInput" accept="image/*" />
    </div>

    <div class="block">
      <h2 class="blocktitle">Analisi</h2>
      <div class="field">
        <label for="detail">Dettaglio</label>
        <select id="detail">
          <option value="1">Intera, una passata · consigliata</option>
          <option value="3">A tile 3×3 · soggetti ravvicinati</option>
          <option value="4">A tile 4×4 · soggetti ravvicinati</option>
        </select>
      </div>
      <div class="summary" id="summary">nessuna immagine</div>
      <p class="note" id="detailNote"></p>

      <div class="sub">
        <div class="field">
          <div class="fieldhead">
            <label for="outSize">Lato lungo in uscita</label>
            <div class="seg mini" role="group">
              <button id="unitPx" aria-pressed="true">px</button>
              <button id="unitMm" aria-pressed="false">mm</button>
            </div>
          </div>
          <div class="numrow">
            <span class="inputwrap"><input type="number" id="outSize" min="256" max="8000" step="1" value="1536" /><em id="outUnit">px</em></span>
            <span class="inputwrap"><input type="number" id="dpi" min="72" max="1200" step="1" value="300" /><em>dpi</em></span>
          </div>
        </div>
        <div class="field">
          <label for="modelSelect">Modello</label>
          <select id="modelSelect">
            <optgroup label="Collaudati">
              <option value="onnx-community/depth-anything-v2-small">Depth Anything v2 small</option>
              <option value="Xenova/dpt-hybrid-midas">MiDaS DPT hybrid</option>
              <option value="Xenova/depth-anything-base-hf">Depth Anything base</option>
              <option value="Xenova/depth-anything-small-hf">Depth Anything v1 small</option>
            </optgroup>
          </select>
          <p class="note" id="modelNote"></p>
        </div>
      </div>

      <div class="primary-slot"><button class="primary" id="generate" disabled>Genera depth map</button></div>
    </div>

    <div class="block">
      <h2 class="blocktitle">Resa</h2>
      <div class="field">
        <label for="presetSelect">Preset</label>
        <select id="presetSelect"></select>
      </div>
      <div class="pair">
        <button class="tiny" id="savePreset">Salva attuale</button>
        <button class="tiny" id="deletePreset">Elimina</button>
      </div>

      <div class="instrument">
        <canvas id="curve" width="660" height="660"></canvas>
        <div class="legend">
          <span id="legendLow">nero 2%</span>
          <span id="legendHint">clicca per aggiungere un punto</span>
          <span id="legendHigh">bianco 98%</span>
        </div>
      </div>
      <div class="pair">
        <button class="tiny" id="curveReset">Azzera curva e tagli</button>
        <button class="tiny" id="invertBtn" aria-pressed="false">Inverti profondità</button>
      </div>

      <div class="sub">
        <div class="field">
          <label for="palette">Palette</label>
          <select id="palette">
            <option value="gray">Scala di grigi</option>
            <option value="xray">Raggi X</option>
            <option value="thermal">Termica</option>
          </select>
        </div>
        <div class="field">
          <label for="equalize">Espandi lontananza <span class="num" id="equalizeVal">0%</span></label>
          <input type="range" id="equalize" min="0" max="100" step="1" value="0" />
        </div>
        <div class="field">
          <label for="edges">Contorni <span class="num" id="edgesVal">0%</span></label>
          <input type="range" id="edges" min="0" max="100" step="1" value="0" />
        </div>
        <div class="field">
          <label for="blur">Sfocatura <span class="num" id="blurVal">0 px</span></label>
          <input type="range" id="blur" min="0" max="20" step="0.5" value="0" />
        </div>
        <div class="field">
          <label for="grain">Grana <span class="num" id="grainVal">0%</span></label>
          <input type="range" id="grain" min="0" max="100" step="1" value="0" />
        </div>
        <div class="field">
          <label for="grainSize">Dimensione grana <span class="num" id="grainSizeVal">1 px</span></label>
          <input type="range" id="grainSize" min="1" max="8" step="0.5" value="1" />
        </div>
        <div class="field">
          <label for="quality">Qualità JPG <span class="num" id="qualityVal">92%</span></label>
          <input type="range" id="quality" min="50" max="100" step="1" value="92" />
        </div>
      </div>

      <div class="primary-slot"><button id="download" disabled>Scarica JPG</button></div>
    </div>

    <div class="cacheline">
      <span id="cacheInfo">cache vuota</span>
      <button id="clearCache">svuota</button>
    </div>
  </aside>

  <main class="stage">
    <div class="stagehead">
      <div class="seg" role="group">
        <button id="viewDepth" aria-pressed="true">Depth</button>
        <button id="viewSource" aria-pressed="false">Originale</button>
      </div>
      <div class="dims" id="dims"></div>
    </div>

    <div class="viewport" id="viewport">
      <span class="empty">nessuna immagine</span>
    </div>

    <div class="statusbar">
      <div class="track"><div id="bar"></div></div>
      <div class="line" id="statusLine">
        <span class="msg" id="statusMsg">Carica un'immagine per iniziare.</span>
        <span id="statusStep"></span>
      </div>
    </div>
  </main>
</div>

<script type="module">
import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.2.0';

/* ---------- cache modelli su IndexedDB ---------- */

const DB_NAME = 'depthmap-model-cache';
let dbPromise = null;

function openDb() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains('files')) db.createObjectStore('files');
      if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta');
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return dbPromise;
}

function idb(store, mode, run) {
  return openDb().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(store, mode);
    const req = run(tx.objectStore(store));
    tx.onerror = () => reject(tx.error);
    if (req) {
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    } else {
      tx.oncomplete = () => resolve(undefined);
    }
  }));
}

const idbCache = {
  async match(request) {
    try {
      const rec = await idb('files', 'readonly', s => s.get(request));
      if (!rec) return undefined;
      const headers = new Headers();
      if (rec.type) headers.set('content-type', rec.type);
      headers.set('content-length', String(rec.buffer.byteLength));
      return new Response(rec.buffer, { status: 200, headers });
    } catch (e) {
      return undefined;
    }
  },
  async put(request, response, progress_callback) {
    try {
      const total = Number(response.headers.get('content-length')) || 0;
      let buffer;
      if (progress_callback && response.body && typeof response.body.getReader === 'function') {
        const reader = response.body.getReader();
        const chunks = [];
        let loaded = 0;
        for (;;) {
          const { done, value } = await reader.read();
          if (done) break;
          chunks.push(value);
          loaded += value.byteLength;
          progress_callback({ progress: total ? (loaded / total) * 100 : 0, loaded, total });
        }
        const merged = new Uint8Array(loaded);
        let offset = 0;
        for (const chunk of chunks) { merged.set(chunk, offset); offset += chunk.byteLength; }
        buffer = merged.buffer;
      } else {
        buffer = await response.arrayBuffer();
      }
      const type = response.headers.get('content-type') || '';
      await idb('files', 'readwrite', s => s.put({ buffer, type }, request));
      await idb('meta', 'readwrite', s => s.put({ size: buffer.byteLength }, request));
      refreshCacheInfo();
    } catch (e) {
      console.warn('cache put', e);
    }
  },
  async delete(request) {
    await idb('files', 'readwrite', s => s.delete(request));
    await idb('meta', 'readwrite', s => s.delete(request));
    return true;
  },
};

const IS_SAFARI = typeof navigator !== 'undefined'
  && /Apple/.test(navigator.vendor || '')
  && !/CriOS|FxiOS|Chrome|Chromium|Edg/.test(navigator.userAgent);

// I thread wasm hanno bisogno di memoria condivisa, e la memoria condivisa si
// puo' passare a un worker solo se la pagina e' cross-origin isolated. Se non lo
// e', il postMessage della SharedArrayBuffer fallisce: su WebKit con
// DataCloneError. SharedArrayBuffer puo' esistere lo stesso, quindi non basta
// controllare quello: l'unico test affidabile e' crossOriginIsolated.
const CAN_THREAD = typeof crossOriginIsolated !== 'undefined' && crossOriginIsolated === true;

if (env.backends && env.backends.onnx && env.backends.onnx.wasm) {
  const cores = (typeof navigator !== 'undefined' && navigator.hardwareConcurrency) || 1;

function humanSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(0) + ' KB';
  return (bytes / 1048576).toFixed(0) + ' MB';
}

function modelIdFromKey(key) {
  const m = String(key).match(/huggingface\.co\/([^/]+\/[^/]+)\//);
  return m ? m[1] : String(key);
}

async function refreshCacheInfo() {
  const el = $('cacheInfo');
  try {
    const db = await openDb();
    const rows = await new Promise((resolve, reject) => {
      const req = db.transaction('meta', 'readonly').objectStore('meta').openCursor();
      const out = [];
      req.onsuccess = () => {
        const c = req.result;
        if (c) { out.push({ key: c.key, size: c.value.size || 0 }); c.continue(); }
        else resolve(out);
      };
      req.onerror = () => reject(req.error);
    });
    if (!rows.length) { el.textContent = 'cache vuota'; return; }
    const models = new Set(rows.map(r => modelIdFromKey(r.key)));
    const total = rows.reduce((a, r) => a + r.size, 0);
    el.textContent = `${models.size} modello${models.size > 1 ? 'i' : ''} in cache · ${humanSize(total)}`;
  } catch (e) {
    el.textContent = 'cache non disponibile';
  }
}

/* ---------- curva ---------- */

// Espansione automatica della lontananza. In un paesaggio le cose lontane
// occupano molti pixel ma pochissimi livelli, perche' sono davvero tutte quasi
// alla stessa distanza. Questa curva ridistribuisce i livelli in proporzione a
// quanti pixel contiene ogni fascia, quindi apre le zone affollate.
//
// L'equalizzazione pura pero' amplifica il rumore dove l'istogramma ha un picco:
// sulla foto di prova arrivava a 10 volte, per via del cielo tutto a zero.
// Limito la pendenza redistribuendo l'eccesso, come si fa nel CLAHE.
// Il limite di pendenza cresce col cursore: a meta' corsa resta prudente, a
// fondo corsa lascia lavorare l'equalizzazione quasi per intero. Con la curva
// letta per interpolazione la sgranatura non e' piu' il fattore limitante.
function eqClipFor(amount) {
  return 1.5 + amount * 10.5;
}

function buildEqualizeLut(clipLimit) {
  if (!eqHistogram) return null;
  const bins = eqHistogram.length;
  const h = Float64Array.from(eqHistogram);
  let total = 0;
  for (let i = 0; i < bins; i++) total += h[i];
  if (total <= 0) return null;

  const clip = clipLimit * (total / bins);
  let excess = 0;
  for (let i = 0; i < bins; i++) {
    if (h[i] > clip) { excess += h[i] - clip; h[i] = clip; }
  }
  const share = excess / bins;
  let sum = 0;
  const c = new Float64Array(bins);
  for (let i = 0; i < bins; i++) { sum += h[i] + share; c[i] = sum; }
  const first = c[0];
  const span = c[bins - 1] - first;
  if (!(span > 0)) return null;

  const lut = new Float32Array(256);
  for (let i = 0; i < 256; i++) {
    const pos = (i / 255) * (bins - 1);
    const j = Math.floor(pos);
    const f = pos - j;
    const a = (c[j] - first) / span;
    const b = (c[Math.min(bins - 1, j + 1)] - first) / span;
    lut[i] = clamp01(a + (b - a) * f);
  }
  return lut;
}

function buildCurveLut() {
  const pts = [];
  const sorted = [...curvePoints].sort((a, b) => a.x - b.x);
  for (const p of sorted) {
    if (pts.length && Math.abs(p.x - pts[pts.length - 1].x) < 1e-4) pts[pts.length - 1] = p;
    else pts.push(p);
  }
  const n = pts.length;
  const lut = new Float32Array(256);
  if (n < 2) {
    for (let i = 0; i < 256; i++) lut[i] = i / 255;
    return lut;
  }
  const xs = pts.map(p => p.x);
  const ys = pts.map(p => p.y);
  const d = new Array(n - 1);
  for (let i = 0; i < n - 1; i++) d[i] = (ys[i + 1] - ys[i]) / (xs[i + 1] - xs[i]);
  const m = new Array(n);
  m[0] = d[0];
  m[n - 1] = d[n - 2];
  for (let i = 1; i < n - 1; i++) m[i] = (d[i - 1] + d[i]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (d[i] === 0) { m[i] = 0; m[i + 1] = 0; continue; }
    const a = m[i] / d[i];
    const b = m[i + 1] / d[i];
    const s = a * a + b * b;
    if (s > 9) {
      const t = 3 / Math.sqrt(s);
      m[i] = t * a * d[i];
      m[i + 1] = t * b * d[i];
    }
  }
  let seg = 0;
  for (let i = 0; i < 256; i++) {
    const x = i / 255;
    while (seg < n - 2 && x > xs[seg + 1]) seg++;
    if (x <= xs[0]) { lut[i] = clamp01(ys[0]); continue; }
    if (x >= xs[n - 1]) { lut[i] = clamp01(ys[n - 1]); continue; }
    const h = xs[seg + 1] - xs[seg];
    const t = (x - xs[seg]) / h;
    const t2 = t * t;
    const t3 = t2 * t;
    lut[i] = clamp01(
      (2 * t3 - 3 * t2 + 1) * ys[seg] +
      (t3 - 2 * t2 + t) * h * m[seg] +
      (-2 * t3 + 3 * t2) * ys[seg + 1] +
      (t3 - t2) * h * m[seg + 1],
    );
  }
  return lut;
}

/* ---------- palette ---------- */

const RAMPS = {
  gray: [[0, '#000000'], [1, '#ffffff']],
  xray: [[0, '#04070d'], [0.22, '#0a2432'], [0.48, '#13596f'], [0.72, '#5fb4cd'], [0.9, '#c6e9f4'], [1, '#f4fcff']],
  thermal: [[0, '#000018'], [0.2, '#2b0a5e'], [0.42, '#8f1a6e'], [0.62, '#df4b34'], [0.82, '#f7b32b'], [1, '#fffbe8']],
};

function hexToRgb(hex) {
  const v = parseInt(hex.slice(1), 16);
  return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
}

const paletteCache = new Map();

function paletteLut(name) {
  if (paletteCache.has(name)) return paletteCache.get(name);
  const stops = (RAMPS[name] || RAMPS.gray).map(([pos, hex]) => ({ pos, rgb: hexToRgb(hex) }));
  const lut = new Uint8ClampedArray(768);
  let seg = 0;
  for (let i = 0; i < 256; i++) {
    const t = i / 255;
    while (seg < stops.length - 2 && t > stops[seg + 1].pos) seg++;
    const a = stops[seg];
    const b = stops[seg + 1] || stops[seg];
    const f = clamp01((t - a.pos) / Math.max(1e-6, b.pos - a.pos));
    lut[i * 3] = a.rgb[0] + (b.rgb[0] - a.rgb[0]) * f;
    lut[i * 3 + 1] = a.rgb[1] + (b.rgb[1] - a.rgb[1]) * f;
    lut[i * 3 + 2] = a.rgb[2] + (b.rgb[2] - a.rgb[2]) * f;
  }
  paletteCache.set(name, lut);
  return lut;
}

/* ---------- strumento: istogramma, curva, tagli, rampa ---------- */

const curveCanvas = $('curve');
const cctx = curveCanvas.getContext('2d');
const CW = 660;
const PLOT_H = 520;
const GUT = 66;
const RAMP_H = 74;
curveCanvas.height = PLOT_H + GUT + RAMP_H;
let dragMode = null;
let dragIndex = -1;

function valueToX(v) { return v * CW; }

// Le due maniglie misurano cose diverse, e vanno lette di conseguenza.
// Il punto nero dice quanti pixel vengono schiacciati sul nero, cioe' quelli
// STRETTAMENTE sotto la soglia: a fondo corsa deve leggere 0%. Il punto bianco
// dice fin dove arriva il segnale conservato, quindi include l'intervallo in cui
// cade: a fondo corsa deve leggere 100%.
function pctBelow(v) {
  if (!cdf) return v * 100;
  const idx = Math.round(clamp01(v) * (cdf.length - 1));
  return idx > 0 ? cdf[idx - 1] * 100 : 0;
}

function pctUpTo(v) {
  if (!cdf) return v * 100;
  const idx = Math.round(clamp01(v) * (cdf.length - 1));
  return cdf[idx] * 100;
}

function valueFromPct(pct, below = false) {
  if (!cdf) return pct / 100;
  const target = pct / 100;
  for (let i = 0; i < cdf.length; i++) {
    const frac = below ? (i > 0 ? cdf[i - 1] : 0) : cdf[i];
    if (frac >= target) return i / (cdf.length - 1);
  }
  return 1;
}

// I percentili restano l'unità dei preset, così valgono su immagini diverse.
// Le maniglie invece vivono in valori assoluti, per non incollarsi sui tratti
// piatti dell'istogramma.
function syncValsFromPct() {
  lowVal = valueFromPct(blackPct, true);
  highVal = valueFromPct(whitePct);
  if (highVal <= lowVal) { lowVal = 0; highVal = 1; }
}

function drawInstrument() {
  const ctx = cctx;
  const H = curveCanvas.height;
  ctx.clearRect(0, 0, CW, H);

  ctx.fillStyle = '#101215';
  ctx.fillRect(0, 0, CW, PLOT_H);

  // griglia
  ctx.strokeStyle = '#1e2228';
  ctx.lineWidth = 2;
  for (let i = 1; i < 4; i++) {
    const gx = (CW / 4) * i;
    const gy = (PLOT_H / 4) * i;
    ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, PLOT_H); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(CW, gy); ctx.stroke();
  }

  // istogramma
  if (histogram) {
    const bins = histogram.length;
    let peak = 0;
    for (const c of histogram) if (c > peak) peak = c;
    const norm = Math.log(1 + peak);
    ctx.fillStyle = '#2c3138';
    for (let i = 0; i < bins; i++) {
      const h = norm > 0 ? (Math.log(1 + histogram[i]) / norm) * PLOT_H * 0.92 : 0;
      ctx.fillRect((i / bins) * CW, PLOT_H - h, CW / bins + 0.6, h);
    }
  }

  const lowX = valueToX(lowVal);
  const highX = valueToX(highVal);

  // zone tagliate
  ctx.fillStyle = 'rgba(10,11,13,.72)';
  ctx.fillRect(0, 0, lowX, PLOT_H);
  ctx.fillRect(highX, 0, CW - highX, PLOT_H);

  // curva, disegnata nell'intervallo utile
  const lut = buildCurveLut();
  ctx.strokeStyle = '#d9a441';
  ctx.lineWidth = 4;
  ctx.lineJoin = 'round';
  ctx.beginPath();
  for (let i = 0; i < 256; i++) {
    const t = i / 255;
    const px = lowX + t * (highX - lowX);
    const py = PLOT_H - lut[i] * PLOT_H;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.stroke();

  // punti
  for (const p of curvePoints) {
    const px = lowX + p.x * (highX - lowX);
    const py = PLOT_H - p.y * PLOT_H;
    ctx.beginPath();
    ctx.arc(px, py, 9, 0, Math.PI * 2);
    ctx.fillStyle = '#131518';
    ctx.fill();
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#f0c368';
    ctx.stroke();
  }

  // maniglie di taglio
  ctx.fillStyle = '#191c20';
  ctx.fillRect(0, PLOT_H, CW, GUT);
  ctx.strokeStyle = '#272b31';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, PLOT_H + 1); ctx.lineTo(CW, PLOT_H + 1); ctx.stroke();

  const drawHandle = (rawX, fill) => {
    const x = Math.max(17, Math.min(CW - 17, rawX));
    ctx.beginPath();
    ctx.moveTo(x, PLOT_H + 6);
    ctx.lineTo(x + 16, PLOT_H + 40);
    ctx.lineTo(x - 16, PLOT_H + 40);
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.strokeStyle = '#3c424a';
    ctx.lineWidth = 2;
    ctx.stroke();
  };
  drawHandle(lowX, '#0a0b0d');
  drawHandle(highX, '#e9ebee');

  // rampa di uscita
  const pal = paletteLut(controls.palette.value);
  const rampTop = PLOT_H + GUT + 8;
  const rampH = RAMP_H - 16;
  for (let i = 0; i < 256; i++) {
    const src = invert ? 255 - i : i;
    const v = Math.round(lut[src] * 255);
    ctx.fillStyle = `rgb(${pal[v * 3]},${pal[v * 3 + 1]},${pal[v * 3 + 2]})`;
    ctx.fillRect((i / 256) * CW, rampTop, CW / 256 + 0.6, rampH);
  }
  ctx.strokeStyle = '#272b31';
  ctx.lineWidth = 2;
  ctx.strokeRect(1, rampTop, CW - 2, rampH);

  $('legendLow').textContent = `nero ${blackPct.toFixed(1)}%`;
  $('legendHigh').textContent = `bianco ${whitePct.toFixed(1)}%`;
}

function curvePos(e) {
  const rect = curveCanvas.getBoundingClientRect();
  const scale = CW / rect.width;
  const cx = (e.clientX - rect.left) * scale;
  const cy = (e.clientY - rect.top) * scale;
  return { cx, cy };
}

curveCanvas.addEventListener('pointerdown', (e) => {
  const { cx, cy } = curvePos(e);
  const lowX = valueToX(lowVal);
  const highX = valueToX(highVal);

  if (cy > PLOT_H) {
    dragMode = Math.abs(cx - lowX) <= Math.abs(cx - highX) ? 'low' : 'high';
    curveCanvas.setPointerCapture(e.pointerId);
    moveHandle(cx);
    return;
  }

  const span = Math.max(1e-6, highX - lowX);
  const x = clamp01((cx - lowX) / span);
  const y = clamp01(1 - cy / PLOT_H);
  let idx = -1;
  let best = 0.07;
  for (let i = 0; i < curvePoints.length; i++) {
    const dist = Math.hypot(curvePoints[i].x - x, curvePoints[i].y - y);
    if (dist < best) { best = dist; idx = i; }
  }
  if (idx === -1) {
    const added = { x, y };
    curvePoints.push(added);
    curvePoints.sort((a, b) => a.x - b.x);
    idx = curvePoints.indexOf(added);
  }
  dragMode = 'point';
  dragIndex = idx;
  curveCanvas.setPointerCapture(e.pointerId);
  drawInstrument();
  schedulePreview();
});

function moveHandle(cx) {
  const v = clamp01(cx / CW);
  if (dragMode === 'low') {
    lowVal = Math.min(v, highVal - 0.01);
    blackPct = pctBelow(lowVal);
  } else {
    highVal = Math.max(v, lowVal + 0.01);
    whitePct = pctUpTo(highVal);
  }
  drawInstrument();
  schedulePreview();
}

curveCanvas.addEventListener('pointermove', (e) => {
  if (!dragMode) return;
  const { cx, cy } = curvePos(e);
  if (dragMode === 'low' || dragMode === 'high') { moveHandle(cx); return; }
  const lowX = valueToX(lowVal);
  const highX = valueToX(highVal);
  const span = Math.max(1e-6, highX - lowX);
  const p = curvePoints[dragIndex];
  if (!p) return;
  p.y = clamp01(1 - cy / PLOT_H);
  if (dragIndex === 0) p.x = 0;
  else if (dragIndex === curvePoints.length - 1) p.x = 1;
  else {
    const x = clamp01((cx - lowX) / span);
    p.x = Math.max(curvePoints[dragIndex - 1].x + 0.01, Math.min(curvePoints[dragIndex + 1].x - 0.01, x));
  }
  drawInstrument();
  schedulePreview();
});

function endDrag(e) {
  if (!dragMode) return;
  dragMode = null;
  dragIndex = -1;
  if (e && e.pointerId !== undefined && curveCanvas.hasPointerCapture(e.pointerId)) curveCanvas.releasePointerCapture(e.pointerId);
}
curveCanvas.addEventListener('pointerup', endDrag);
curveCanvas.addEventListener('pointercancel', endDrag);

curveCanvas.addEventListener('dblclick', (e) => {
  const { cx, cy } = curvePos(e);
  if (cy > PLOT_H) return;
  const lowX = valueToX(lowVal);
  const highX = valueToX(highVal);
  const span = Math.max(1e-6, highX - lowX);
  const x = clamp01((cx - lowX) / span);
  const y = clamp01(1 - cy / PLOT_H);
  let idx = -1;
  let best = 0.07;
  for (let i = 1; i < curvePoints.length - 1; i++) {
    const dist = Math.hypot(curvePoints[i].x - x, curvePoints[i].y - y);
    if (dist < best) { best = dist; idx = i; }
  }
  if (idx > 0) {
    curvePoints.splice(idx, 1);
    drawInstrument();
    schedulePreview();
  }
});

$('invertBtn').addEventListener('click', () => {
  invert = !invert;
  $('invertBtn').setAttribute('aria-pressed', String(invert));
  drawInstrument();
  schedulePreview();
});

$('curveReset').addEventListener('click', () => {
  curvePoints = [{ x: 0, y: 0 }, { x: 1, y: 1 }];
  blackPct = 0;
  whitePct = 100;
  syncValsFromPct();
  drawInstrument();
  schedulePreview();
});

    const o = document.createElement('option');
    o.value = 'b:' + key;
    o.textContent = p.label;
    g1.appendChild(o);
  }
  sel.appendChild(g1);
  const mine = userPresets();
  const names = Object.keys(mine);
  if (names.length) {
    const g2 = document.createElement('optgroup');
    g2.label = 'Miei';
    for (const n of names) {
      const o = document.createElement('option');
      o.value = 'u:' + n;
      o.textContent = n;
      g2.appendChild(o);
    }
    sel.appendChild(g2);
  }
  sel.value = selected;
}

/* ---------- caricamento ---------- */

function loadFromSrc(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('il browser ha rifiutato la sorgente'));
    img.src = src;
  });
}

function fileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(new Error('lettura del file non riuscita'));
    reader.readAsDataURL(file);
  });
}

// Tre strade in ordine di robustezza. createImageBitmap lavora direttamente sul
// File. Il data URL funziona anche su file://, dove i blob URL vengono rifiutati
// perche' l'origine del documento e' null. Il blob URL resta come ultima spiaggia.
async function decodeImage(file) {
  const failures = [];
  if (typeof createImageBitmap === 'function') {
    try { return await createImageBitmap(file); }
    catch (e) { failures.push('createImageBitmap: ' + (e.message || e)); }
  }
  try { return await loadFromSrc(await fileToDataUrl(file)); }
  catch (e) { failures.push('data URL: ' + (e.message || e)); }
  let url = null;
  try {
    url = URL.createObjectURL(file);
    const img = await loadFromSrc(url);
    URL.revokeObjectURL(url);
    return img;
  } catch (e) {
    if (url) URL.revokeObjectURL(url);
    failures.push('blob URL: ' + (e.message || e));
  }
  throw new Error(failures.join(' · '));
}

async function pickFile(file) {
  if (!file) return;
  if (!file.type.startsWith('image/')) { setStatus('Serve un file immagine: JPG, PNG o WebP.', 'err'); return; }
  setStatus('Apro il file.');
  try {
    const decoded = await decodeImage(file);
    srcW = decoded.naturalWidth || decoded.width;
    srcH = decoded.naturalHeight || decoded.height;
    if (!srcW || !srcH) throw new Error('dimensioni non leggibili');
    sourceImage = decoded;
    sourceName = baseName(file.name);
    const prev = fitSize(srcW, srcH, 2000);
    sourcePreview = scaledCanvas(decoded, 0, 0, srcW, srcH, prev.w, prev.h);
    fullDepth = null;
    fullRefined = null;
    proxyDepth = null;
    proxyRefined = null;
    depthCanvas = null;
    histogram = null;
    cdf = null;
    generateBtn.disabled = embeddedBlock;
    downloadBtn.disabled = true;
    $('fileinfo').textContent = `${file.name} · ${srcW}×${srcH}`;
    setView('source');
    setProgress(0, '');
    updateSummary();
    if (embeddedBlock) setStatus('Immagine caricata. Per generare la depth map scarica il file e aprilo come pagina.', 'warn');
    else setStatus('Pronto. Premi Genera depth map.');
    drawInstrument();
  } catch (e) {
    const where = location.protocol === 'file:' ? '\nLa pagina gira da file://, prova a servirla da un server locale.' : '';
    setStatus(`Non riesco a decodificare ${file.name} (${file.type || 'tipo ignoto'}, ${humanSize(file.size)}).\n${e.message}${where}`, 'err');
  }
}
